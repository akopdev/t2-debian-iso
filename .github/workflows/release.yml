name: Build ISO on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ISO
        run: make build

      - name: Rename ISO for release
        run: mv output/live-image-amd64.hybrid.iso "output/t2-debian-iso-${{ github.event.release.tag_name }}.iso"

      - name: Upload ISO to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" output/*.iso --clobber
